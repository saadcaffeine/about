name: Deploy to ediblemakerspace.com/about

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTPS deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.visualpurpledesign.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /ediblemakerspace.com/about/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            tools/**
            wordpress/**
            *.patch

      # llms.txt is only discovered at the domain root, which WordPress owns.
      # Sync just wordpress/root/ (one file) there. Same action and TLS
      # settings as the main deploy; it only ever deletes files it uploaded
      # itself (tracked in its own state file), so WordPress is untouched.
      - name: Upload root llms.txt
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.visualpurpledesign.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wordpress/root/
          server-dir: /ediblemakerspace.com/
          state-name: .ftp-deploy-root-llms-state.json
