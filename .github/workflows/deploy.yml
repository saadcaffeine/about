name: Deploy to ediblemakerspace.com/about

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTPS deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.visualpurpledesign.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /ediblemakerspace.com/about/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            tools/**
            wordpress/**
            *.patch

      # llms.txt is only discovered at the domain root, which WordPress owns.
      # Upload just this one file there; nothing else at the root is touched.
      - name: Upload root llms.txt
        continue-on-error: true
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T wordpress/root/llms.txt \
            "ftp://ftp.visualpurpledesign.com/ediblemakerspace.com/llms.txt"
